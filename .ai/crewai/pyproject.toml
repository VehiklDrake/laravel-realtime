[project]
name = "laravel_vue_dev_team"
version = "0.1.0"
description = "Repository-aware Laravel and Vue development team using CrewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,google-genai,litellm]>=1.15.14,<2.0.0"
]

[project.scripts]
kickoff = "laravel_vue_dev_team.main:kickoff"
